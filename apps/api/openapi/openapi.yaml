openapi: 3.1.0
info:
  title: JainConnect API
  version: 0.1.0
  description: Initial versioned API contract for the JainConnect foundation.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: registerAccount
      summary: Create a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Account created. No session or password is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      operationId: loginAccount
      summary: Start an opaque bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Session token and public account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credentials are invalid or the account is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      operationId: getCurrentAccount
      summary: Get the current authenticated account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing, expired, or revoked session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: logoutAccount
      summary: Revoke the current bearer session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked.
        '401':
          description: Missing, expired, or revoked session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/access:
    get:
      operationId: getAdminAccess
      summary: Check whether the current account has a reviewed admin role
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active admin role keys for the current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessResponse'
        '401':
          description: Missing, expired, or revoked session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated account has no admin role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/temples:
    get:
      operationId: listAdminTemples
      summary: List temple records for authorized staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/PublicationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated administrative temple records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTempleListResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has no administrative role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createAdminTemple
      summary: Create a pending temple record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTempleInput'
      responses:
        '201':
          description: Pending temple created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTempleResponse'
        '400':
          description: Invalid temple details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account cannot edit content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/temples/{id}:
    patch:
      operationId: updateAdminTemple
      summary: Edit a temple record without changing its review state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTemplePatch'
      responses:
        '200':
          description: Updated temple record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTempleResponse'
        '400':
          description: Invalid ID or temple details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Temple not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/temples/{id}/verification:
    post:
      operationId: reviewAdminTemple
      summary: Record a temple verification decision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationInput'
      responses:
        '200':
          description: Updated temple review state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTempleResponse'
        '400':
          description: Invalid review input or ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Temple not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The requested state transition is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/temples/{id}/publication:
    post:
      operationId: setAdminTemplePublication
      summary: Change a temple publication state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationInput'
      responses:
        '200':
          description: Updated temple publication state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTempleResponse'
        '400':
          description: Invalid publication input or ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Unverified temples cannot be published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/organizations:
    get:
      operationId: listAdminOrganizations
      summary: List organization records for authorized staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/PublicationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated administrative organization records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationListResponse'
    post:
      operationId: createAdminOrganization
      summary: Create a pending organization record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrganizationInput'
      responses:
        '201':
          description: Pending organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationResponse'
  /admin/organizations/{id}:
    patch:
      operationId: updateAdminOrganization
      summary: Edit an organization record and re-review published changes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrganizationPatch'
      responses:
        '200':
          description: Updated organization record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationResponse'
        '400':
          description: Invalid ID or organization details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/organizations/{id}/publication:
    post:
      operationId: setAdminOrganizationPublication
      summary: Change an organization publication state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationInput'
      responses:
        '200':
          description: Updated organization publication state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationResponse'
        '400':
          description: Invalid publication input or ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Unverified organizations cannot be published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/organizations/{id}/verification:
    post:
      operationId: reviewAdminOrganization
      summary: Record an organization verification decision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationInput'
      responses:
        '200':
          description: Updated organization review state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationResponse'
        '409':
          description: The requested state transition is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/representative-claims:
    get:
      operationId: listRepresentativeClaims
      summary: List organization representative claims for reviewers
      description: >-
        Requires the ADMIN or VERIFIER role. Claim review is bounded and does not expose
        evidence or reviewer notes to unauthorized callers.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RepresentativeClaimStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/AuditPageSize'
      responses:
        '200':
          description: Paginated representative claims with restricted applicant details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRepresentativeClaimListResponse'
  /admin/representative-claims/{id}/decision:
    post:
      operationId: decideRepresentativeClaim
      summary: Decide an organization representative claim
      description: >-
        Requires the ADMIN or VERIFIER role. Allowed transitions are PENDING to
        APPROVED, REJECTED, or NEEDS_MORE_INFO; NEEDS_MORE_INFO to APPROVED or
        REJECTED; and APPROVED to REVOKED. REJECTED and REVOKED are terminal.
        The reviewer cannot decide their own claim. Approval rechecks that the
        applicant is active and the organization is VERIFIED and PUBLISHED, and
        concurrent decisions are serialized by the server.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepresentativeClaimDecisionInput'
      responses:
        '200':
          description: Claim decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentativeClaimDecisionResponse'
        '403':
          description: Self-approval or reviewer permission violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The organization is not eligible for representative approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/organizations/{id}/members/{memberId}/revoke:
    post:
      operationId: revokeOrganizationMember
      summary: Revoke an organization membership
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Membership revoked.
        '404':
          description: Active membership not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/corrections:
    get:
      operationId: listAdminCorrections
      summary: List correction requests for reviewers
      description: Requires the MODERATOR or ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CorrectionStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/AuditPageSize'
      responses:
        '200':
          description: Paginated correction requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCorrectionListResponse'
        '403':
          description: An active MODERATOR or ADMIN role is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/corrections/{id}/decision:
    post:
      operationId: decideCorrection
      summary: Review an authenticated public-record correction request
      description: >-
        Requires the MODERATOR or ADMIN role. APPROVED accepts the submitted
        suggestion for a separate content-editor workflow only; it does not
        change public content, lifecycle state, publication, or verification.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionDecisionInput'
      responses:
        '200':
          description: Correction decision recorded without mutating public content or review state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionDecisionResponse'
        '409':
          description: Invalid correction state transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: An active MODERATOR or ADMIN role is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/audit:
    get:
      operationId: listAdminAuditEvents
      summary: List redacted administrative audit events
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/AuditPageSize'
      responses:
        '200':
          description: Paginated audit events without private review evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
  /admin/reports:
    get:
      operationId: listAdminReports
      summary: List community reports for moderators
      description: Requires the MODERATOR or ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/AuditPageSize'
      responses:
        '200':
          description: Paginated reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
  /admin/reports/{id}:
    patch:
      operationId: updateAdminReport
      summary: Moderate a community report
      description: >-
        Requires the MODERATOR or ADMIN role. ACTIONED and DISMISSED require a
        fresh resolutionCode in this request. Reopening with OPEN clears any
        previous resolution code.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportUpdateInput'
      responses:
        '200':
          description: Updated report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDecisionResponse'
        '404':
          description: Report not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/temples/{id}:
    post:
      operationId: createTempleReport
      summary: Submit a report about a temple
      description: The target must be a verified and published temple.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '201':
          description: Report created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreatedResponse'
        '400':
          description: Invalid report details or ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An open report already exists for this record and account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Temple not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/organizations/{id}:
    post:
      operationId: createOrganizationReport
      summary: Submit a report about an organization
      description: The target must be a verified and published organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '201':
          description: Report created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreatedResponse'
        '400':
          description: Invalid report details or ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found or not publicly eligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An open report already exists for this record and account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/temples/{id}/corrections:
    post:
      operationId: createTempleCorrection
      summary: Submit an authenticated correction for a public temple
      description: >-
        The target must be a verified and published temple. This creates a
        review suggestion only; it does not directly change public content,
        lifecycle state, publication, or verification.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionInput'
      responses:
        '201':
          description: Correction submitted for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionSubmissionResponse'
        '400':
          description: Invalid correction details or ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Temple not found or not publicly eligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A correction is already open for this record and account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/organizations/{id}/corrections:
    post:
      operationId: createOrganizationCorrection
      summary: Submit an authenticated correction for a public organization
      description: >-
        The target must be a verified and published organization. This creates
        a review suggestion only; it does not directly change public content,
        lifecycle state, publication, or verification.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionInput'
      responses:
        '201':
          description: Correction submitted for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionSubmissionResponse'
        '400':
          description: Invalid correction details or ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found or not publicly eligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A correction is already open for this record and account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organizations/{id}/representative-claims:
    post:
      operationId: submitRepresentativeClaim
      summary: Request scoped organization representative access
      description: >-
        An active authenticated user may claim only a VERIFIED and PUBLISHED
        organization. Duplicate in-review claims and concurrent membership
        changes are rejected safely.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepresentativeClaimInput'
      responses:
        '201':
          description: Representative claim submitted for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentativeClaimSubmissionResponse'
        '409':
          description: An open claim already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated applicant account is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found or not VERIFIED and PUBLISHED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/organization-memberships:
    get:
      operationId: listMyOrganizationMemberships
      summary: List the authenticated user's organization memberships
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bounded memberships for the current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembershipListResponse'
  /me/representative-claims:
    get:
      operationId: listMyRepresentativeClaims
      summary: List the authenticated user's representative claims
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bounded claims for the current account with safe applicant fields only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentativeClaimListResponse'
  /me/reports:
    get:
      operationId: listMyReports
      summary: List reports submitted by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bounded report statuses and safe target labels for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyReportListResponse'
  /me/corrections:
    get:
      operationId: listMyCorrections
      summary: List corrections submitted by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bounded correction statuses without reviewer notes or reviewer identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCorrectionListResponse'
  /me/organizations/{id}:
    get:
      operationId: getMyOrganization
      summary: Get an organization managed by the authenticated user
      description: >-
        Returns only the safe organization fields available through an active,
        approved membership. Review evidence, notes, and creator identity are
        not returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Scoped representative organization data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentativeOrganizationResponse'
        '404':
          description: The organization is not managed by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/temples/{id}:
    get:
      operationId: getMyTemple
      summary: Get an associated temple managed by the authenticated user
      description: Returns safe temple fields through an active, approved organization membership.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Scoped representative temple data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentativeTempleResponse'
        '404':
          description: The temple is not managed through the current user's organization membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/organizations/{id}/temples:
    get:
      operationId: listMyOrganizationTemples
      summary: List temples associated with an organization managed by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bounded safe temple records for the scoped organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentativeTempleListResponse'
        '404':
          description: The organization is not managed by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is running
      responses:
        '200':
          description: The process is accepting requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required runtime dependencies are available
      responses:
        '200':
          description: The API and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /temples:
    get:
      operationId: listPublicTemples
      summary: List approved public temple records
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated list of verified and published temples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempleListResponse'
        '400':
          description: Invalid search filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /temples/{slug}:
    get:
      operationId: getPublicTemple
      summary: Get one approved public temple record
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        '200':
          description: A verified and published temple.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempleResponse'
        '404':
          description: The approved public temple does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateTempleAsRepresentative
      summary: Update an associated temple through an approved organization membership
      description: >-
        The path value is the temple resource UUID for this operation. Only
        public representative fields are accepted; verification and publication
        remain server-controlled.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUID of the temple resource for this protected operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TempleRepresentativePatch'
      responses:
        '200':
          description: Updated temple record; material edits may unpublish it for re-review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentativeTempleResponse'
        '403':
          description: The authenticated user has no suitable active organization membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organizations:
    get:
      operationId: listPublicOrganizations
      summary: List approved public Jain organizations and trusts
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/OrganizationType'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated list of verified and published organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '400':
          description: Invalid organization search filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organizations/{slug}:
    get:
      operationId: getPublicOrganization
      summary: Get one approved public organization or trust
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        '200':
          description: A verified and published organization with safe public temple associations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Invalid organization slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The approved public organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateOrganizationAsRepresentative
      summary: Update an organization through an approved scoped membership
      description: >-
        The path value is the organization resource UUID for this operation.
        Only public representative fields are accepted; verification and
        publication remain server-controlled.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUID of the organization resource for this protected operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRepresentativePatch'
      responses:
        '200':
          description: Updated organization record; material edits may unpublish it for re-review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentativeOrganizationResponse'
        '403':
          description: The authenticated user has no suitable active membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
    City:
      name: city
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 120
    State:
      name: state
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 120
    OrganizationType:
      name: organizationType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrganizationType'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    AuditPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VerificationStatus:
      name: verificationStatus
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/VerificationStatus'
    PublicationStatus:
      name: publicationStatus
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PublicationStatus'
  schemas:
    RegistrationInput:
      type: object
      additionalProperties: false
      required: [email, displayName, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 128
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, 'null']
          format: email
        displayName:
          type: string
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, expiresAt, user]
          properties:
            accessToken:
              type: string
              description: Opaque bearer token. Store only in platform-protected client storage.
            expiresAt:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/User'
    AdminAccessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [roles]
          properties:
            roles:
              type: array
              items:
                type: string
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED, SUSPENDED, NEEDS_REVIEW]
    PublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED, ARCHIVED]
    OrganizationType:
      type: string
      enum: [TEMPLE_TRUST, COMMUNITY_GROUP, CHARITY, OTHER]
    ReportStatus:
      type: string
      enum: [OPEN, IN_REVIEW, ACTIONED, DISMISSED]
    OrganizationMembershipRole:
      type: string
      enum: [OWNER, MANAGER, EDITOR, VIEWER]
    OrganizationMembershipStatus:
      type: string
      enum: [PENDING, ACTIVE, REVOKED]
    RepresentativeClaimStatus:
      type: string
      description: >-
        Claims transition PENDING to APPROVED, REJECTED, or NEEDS_MORE_INFO;
        NEEDS_MORE_INFO to APPROVED or REJECTED; and APPROVED to REVOKED.
        REJECTED and REVOKED are terminal.
      enum: [PENDING, APPROVED, REJECTED, NEEDS_MORE_INFO, REVOKED]
    CorrectionStatus:
      type: string
      enum: [SUBMITTED, IN_REVIEW, NEEDS_CHANGES, APPROVED, REJECTED, WITHDRAWN]
    RepresentativeClaimInput:
      type: object
      additionalProperties: false
      required: [requestedRole, applicantStatement]
      properties:
        requestedRole:
          type: string
          enum: [OWNER, MANAGER, EDITOR]
        applicantStatement:
          type: string
          minLength: 20
          maxLength: 2000
        sourceUrl:
          type: string
          format: uri
          maxLength: 2048
    RepresentativeClaimDecisionInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED, NEEDS_MORE_INFO, REVOKED]
        notes:
          type: string
          maxLength: 2000
          description: Private reviewer note; never returned in member-facing responses.
    CorrectionInput:
      type: object
      additionalProperties: false
      required: [reasonCode, description]
      properties:
        reasonCode:
          type: string
          minLength: 2
          maxLength: 64
        description:
          type: string
          minLength: 10
          maxLength: 2000
        proposedChanges:
          type: object
          additionalProperties:
            type: string
            maxLength: 4000
        sourceUrl:
          type: string
          format: uri
          maxLength: 2048
    CorrectionDecisionInput:
      type: object
      additionalProperties: false
      description: >-
        A moderator or administrator records a workflow decision. APPROVED
        accepts the suggestion for a separate content-editor workflow only; it
        does not apply proposed changes or mutate public, lifecycle, publication,
        or verification state.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/CorrectionStatus'
        reviewerNotes:
          type: string
          maxLength: 2000
    VerificationInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        notes:
          type: string
          maxLength: 2000
          description: Private reviewer note. Never returned by public endpoints.
    PublicationInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/PublicationStatus'
    AdminTempleFields:
