      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 180
        organizationId:
          type: [string, 'null']
          format: uuid
        traditionOrLineage:
          type: [string, 'null']
